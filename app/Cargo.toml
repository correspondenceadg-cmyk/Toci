[package]
name = "toci"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = { version = "0.2", optional = true }
zeroize = { version = "1.8", features = ["derive"], optional = true }
log = "0.4"
android_logger = "0.15"

[build-dependencies]
cc = "1"
